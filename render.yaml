# Déploiement Render (Blueprint) — https://render.com/docs/blueprint-spec
# Render → New → Blueprint → choisir ce dépôt → Apply.
services:
  - type: web
    name: gouabo
    runtime: node
    # Instance gratuite : pas de disque persistant, les données sont réinitialisées à chaque redémarrage.
    # Pour une utilisation réelle (abonnements payants), passez à une instance payante avec un disque.
    plan: free
    region: frankfurt
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/sante
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Secrets générés par Render
      - key: JWT_SECRET
        generateValue: true
      # Code d'accès du portail propriétaire (/proprietaire/) : généré par Render,
      # à lire dans le tableau de bord Render → Environment → PROPRIETAIRE_CODE
      - key: PROPRIETAIRE_CODE
        generateValue: true
      # Facultatif, à ajouter ensuite dans Render → Environment :
      #   PUBLIC_URL, CODE_INVITATION, ANTHROPIC_API_KEY (agents IA),
      #   CINETPAY_API_KEY et CINETPAY_API_PASSWORD (portail Orange Money / MTN),
      #   SMS_PROVIDER_*, SMTP_*
