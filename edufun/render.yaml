# Déploiement EduFun sur Render : New + → Blueprint → dépôt kingskeymanuel-wq/edufun (render.yaml à la racine).
services:
  - type: web
    name: edufun
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    branch: main
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: EDUFUN_DEMO_DATA
        value: "true"
      - key: EDUFUN_DEMO_PASSWORD
        value: Demo@2026
      - key: EDUFUN_ADMIN_EMAIL
        value: kingskeymanuel@gmail.com
      - key: EDUFUN_ADMIN_PASSWORD
        value: EduFun@Test2026
      - key: EDUFUN_SITE_URL
        value: https://edufun.onrender.com
