<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/edufun.css">
<link rel="stylesheet" href="/css/curriculum.css">
<script defer src="/js/edufun.js"></script><script defer src="/js/ui.js"></script>
<title>Mon programme — EduFun</title>
<link rel="stylesheet" href="/css/ui.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">🎓 Edu<span>Fun</span></div>
    <nav class="nav">
      <small>Mon espace</small>
      <a href="/dashboard">🏠 Tableau de bord</a>
      <a href="/profil">👤 Mon profil</a>
      <a href="/abonnement">💳 Mon abonnement</a>
      <a href="/programme">📚 Mon programme</a>
      <a href="/quiz">🧠 Quiz &amp; défis</a>
      <a href="/examens">🏆 Prépa Examen</a>
      <a href="/certificats">🎓 Certificats</a>
      <a href="/tech-lab">💻 Tech Lab</a>
      <small>Accompagnement</small>
      <a href="/repetiteurs">👨‍🏫 Répétiteurs</a>
      <a href="/inscription">📝 Inscription</a>
      <a href="/login">🔐 Se connecter</a>
      <form th:action="@{/logout}" method="post" class="logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="nav-logout" type="submit">↪️ Se déconnecter</button></form>
    </nav>
  </aside>

  <main class="main cu" id="curriculumPage">
    <header class="cu-top">
      <button class="btn ghost mobile-menu" aria-label="Ouvrir le menu">☰</button>
      <div>
        <span class="cu-kicker">Programme éducatif ivoirien · Approche par compétences</span>
        <h1 class="cu-title">Mon programme</h1>
      </div>
    </header>

    <section class="cu-panel cu-picker" aria-label="Choix de la classe">
      <div class="cu-cycles" role="tablist" data-cycles></div>
      <div class="cu-levels" data-levels></div>
    </section>

    <section class="cu-head" data-level-head></section>

    <nav class="cu-subjects" aria-label="Disciplines" data-subjects></nav>

    <section class="cu-chapters" data-chapters aria-live="polite">
      <div class="cu-skel"></div><div class="cu-skel"></div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
</body>
</html>
