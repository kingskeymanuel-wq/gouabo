<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/css/edufun.css">
<link rel="stylesheet" href="/css/admin.css">
<title>Console — EduFun</title>
<link rel="stylesheet" href="/css/ui.css">
</head>
<body class="cx-page">
<main class="cx-shell">
  <section class="cx-card" aria-labelledby="cx-title">
    <header class="cx-head">
      <div class="cx-brand">Edu<span>Fun</span> <em>· Console</em></div>
      <h1 id="cx-title">Accès réservé</h1>
      <p>Espace d'administration. Connectez-vous avec votre compte administrateur.</p>
    </header>

    <div th:if="${param.error}" class="cx-alert error" role="alert">Identifiants incorrects ou compte non autorisé.</div>
    <div th:if="${param.logout}" class="cx-alert success" role="status">Vous avez été déconnecté.</div>

    <form class="cx-form" th:action="@{/login}" method="post" autocomplete="on">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="portal" value="admin">
      <label class="cx-field"><span>Adresse e-mail</span>
        <input name="username" type="email" autocomplete="username" required autofocus>
      </label>
      <label class="cx-field"><span>Mot de passe</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="cx-submit" type="submit">Se connecter</button>
    </form>

    <footer class="cx-foot"><i aria-hidden="true"></i>Connexion chiffrée · activité journalisée</footer>
  </section>
</main>
</body>
</html>
