<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/edufun.css">
<link rel="stylesheet" href="/css/curriculum.css">
<link rel="stylesheet" href="/css/prep.css">
<script defer src="/js/edufun.js"></script>
<script defer src="/js/prep.js"></script>
<title>Prépa Examens — EduFun</title>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">🎓 Edu<span>Fun</span></div>
    <nav class="nav">
      <small>Mon espace</small>
      <a href="/dashboard">🏠 Tableau de bord</a>
      <a href="/programme">📚 Mon programme</a>
      <a href="/quiz">🧠 Quiz &amp; défis</a>
      <a href="/examens">🏆 Prépa Examen</a>
      <a href="/certificats">🎓 Certificats</a>
      <a href="/tech-lab">💻 Tech Lab</a>
      <small>Accompagnement</small>
      <a href="/repetiteurs">👨‍🏫 Répétiteurs</a>
      <a href="/administration">⚙️ Administration</a>
      <a href="/inscription">📝 Inscription</a>
      <a href="/login">🔐 Se connecter</a>
      <form th:action="@{/logout}" method="post" class="logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="nav-logout" type="submit">↪️ Se déconnecter</button></form>
    </nav>
  </aside>

  <main class="main cu px" id="prepPage">
    <header class="cu-top">
      <button class="btn ghost mobile-menu" aria-label="Ouvrir le menu">☰</button>
      <div>
        <span class="cu-kicker">Préparation aux examens nationaux</span>
        <h1 class="cu-title">Prépa Examens</h1>
      </div>
    </header>

    <section class="px-exams" data-exams aria-label="Choix de l'examen">
      <div class="cu-skel"></div><div class="cu-skel"></div><div class="cu-skel"></div>
    </section>

    <section class="px-panel" data-panel hidden>
      <div class="px-tabs" role="tablist" data-tabs>
        <button role="tab" data-tab="matieres" aria-selected="true">📚 Matières</button>
        <button role="tab" data-tab="faq" aria-selected="false">❓ FAQ</button>
        <button role="tab" data-tab="resultats" aria-selected="false">📈 Mes résultats</button>
      </div>
      <div data-view></div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
</body>
</html>
