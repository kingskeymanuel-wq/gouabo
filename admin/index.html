<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>GOUABO — Administration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23008060'/><path d='M10 12h12l-1.2 11H11.2z M13 12a3 3 0 0 1 6 0' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>" />

  <!-- Application installable (téléphone et ordinateur) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icones/icone-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="GOUABO" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
  <script src="/partage/installer.js" defer></script>
  <link rel="stylesheet" href="/partage/polices/polices.css" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Applique le thème enregistré avant le premier rendu (évite le flash) -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("moncommerce-reglages") || "{}");
        var t = s.theme || "systeme";
        var dark = t === "sombre" || (t === "systeme" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>

</head>
<body>
  <div id="root"></div>

  <!-- app.jsx préparé par « npm run construire » (backend) -->
  <script type="module" src="app.min.js"></script>
</body>
</html>
